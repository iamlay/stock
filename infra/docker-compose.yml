name: stocklab

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stocklab
      POSTGRES_PASSWORD: stocklab
      POSTGRES_DB: stocklab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocklab -d stocklab"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      STOCKLAB_ENV: production
      STOCKLAB_CORS_ORIGINS: http://localhost:3000
      STOCKLAB_DATABASE_URL: postgresql+psycopg://stocklab:stocklab@db:5432/stocklab
      STOCKLAB_AUTH_DEV_MODE: ${STOCKLAB_AUTH_DEV_MODE:-false}
      STOCKLAB_JWT_SECRET: ${STOCKLAB_JWT_SECRET:-change-me-in-production-32-bytes-minimum}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
