name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stocklab/web typecheck
      - run: pnpm --filter @stocklab/web test:return-path
      - run: pnpm --filter @stocklab/web test:plans
      - run: pnpm --filter @stocklab/web test:trial
      - run: pnpm --filter @stocklab/web test:orders
      - run: pnpm --filter @stocklab/web test:task-context
      - run: pnpm --filter @stocklab/web build

  api:
    name: API (lint + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stocktest
          POSTGRES_PASSWORD: stocktest
          POSTGRES_DB: stocklab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stocktest -d stocklab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STOCKLAB_TEST_POSTGRES_URL: postgresql+psycopg://stocktest:stocktest@127.0.0.1:5432/stocklab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "apps/api[dev]"
      - run: python -m pip install "ruff==0.17.1"
      - run: python -m ruff check apps/api etl --output-format=github
      - run: python -m pytest apps/api -q
