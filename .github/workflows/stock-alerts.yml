name: Stock Alerts

on:
  workflow_dispatch:

concurrency:
  group: stock-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API package
        run: pip install -e apps/api

      - name: Run migrations
        env:
          STOCKLAB_DATABASE_URL: ${{ secrets.STOCKLAB_DATABASE_URL }}
        run: alembic -c apps/api/alembic.ini upgrade head

      - name: Generate watchlist alerts
        env:
          STOCKLAB_DATABASE_URL: ${{ secrets.STOCKLAB_DATABASE_URL }}
        run: |
          python -m app.cli stock-alerts
          python -m etl.cli stock-status
