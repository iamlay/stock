name: Stock Yield Percentile

on:
  schedule:
    # 1st of each month, 22:00 Asia/Shanghai
    - cron: "0 14 1 * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of high-yield stocks"
        default: "1000"
      days:
        description: "History days"
        default: "3650"

concurrency:
  group: stock-yield-percentile
  cancel-in-progress: false

jobs:
  percentile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API package
        run: pip install -e apps/api

      - name: Run migrations
        env:
          STOCKLAB_DATABASE_URL: ${{ secrets.STOCKLAB_DATABASE_URL }}
        run: alembic -c apps/api/alembic.ini upgrade head

      - name: Compute 10-year yield percentile
        env:
          STOCKLAB_DATABASE_URL: ${{ secrets.STOCKLAB_DATABASE_URL }}
        run: |
          python -m etl.cli stock-yield-percentile \
            --limit "${{ inputs.limit || '1000' }}" \
            --days "${{ inputs.days || '3650' }}"
          python -m etl.cli stock-status
