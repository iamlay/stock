name: DB Backup

on:
  schedule:
    # 03:00 Asia/Shanghai
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/pgdg.asc
          sudo rm -f /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          sudo gpg --batch --yes --dearmor \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg \
            /tmp/pgdg.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Dump and encrypt
        env:
          STOCKLAB_DATABASE_URL: ${{ secrets.STOCKLAB_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${STOCKLAB_DATABASE_URL:-}" ]; then
            echo "::error title=Missing STOCKLAB_DATABASE_URL::Configure the repository secret STOCKLAB_DATABASE_URL"
            exit 1
          fi
          if [ -z "${BACKUP_ENCRYPTION_KEY:-}" ]; then
            echo "::error title=Missing BACKUP_ENCRYPTION_KEY::Add a repository secret named BACKUP_ENCRYPTION_KEY"
            exit 1
          fi
          trap 'echo "::error title=DB backup failed::pg_dump or openssl failed at line $LINENO"' ERR
          DB_URL="${STOCKLAB_DATABASE_URL/postgresql+psycopg/postgresql}"
          if [[ "$DB_URL" != *"sslmode="* ]]; then
            if [[ "$DB_URL" == *"?"* ]]; then
              DB_URL="$DB_URL&sslmode=require"
            else
              DB_URL="$DB_URL?sslmode=require"
            fi
          fi
          export PGSSLMODE=require
          export PGCONNECT_TIMEOUT=30
          ok=0
          for attempt in 1 2 3; do
            if /usr/lib/postgresql/18/bin/pg_dump "$DB_URL" \
              --format=custom \
              --no-owner \
              --no-privileges \
              --file=backup.dump; then
              ok=1
              break
            fi
            echo "pg_dump attempt ${attempt} failed; retrying"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in backup.dump \
            -out "stocklab-$(date +%F).dump.enc" \
            -pass env:BACKUP_ENCRYPTION_KEY
          rm -f backup.dump
          sha256sum stocklab-*.dump.enc

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: stocklab-db-${{ github.run_id }}
          path: stocklab-*.dump.enc
          retention-days: 14
          if-no-files-found: error
