name: Stock Dividends

on:
  schedule:
    # Monday 19:00 Asia/Shanghai
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Dividend lookback days"
        default: "730"

concurrency:
  group: stock-dividends
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API package
        run: pip install -e apps/api

      - name: Run migrations
        env:
          STOCKLAB_DATABASE_URL: ${{ secrets.STOCKLAB_DATABASE_URL }}
        run: alembic -c apps/api/alembic.ini upgrade head

      - name: Refresh dividends and yields
        env:
          STOCKLAB_DATABASE_URL: ${{ secrets.STOCKLAB_DATABASE_URL }}
        run: |
          python -m etl.cli stock-dividends-bulk --days "${{ inputs.days }}"
          python -m etl.cli stock-status
